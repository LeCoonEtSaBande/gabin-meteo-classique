<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e0e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Gabin-météo classique</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell" id="shell">
    <nav class="modes" aria-label="Vues">
      <button type="button" class="mode is-active" data-mode="daily" id="mode-daily">Prévisions</button>
      <button type="button" class="mode" data-mode="buoys" id="mode-buoys">Balise</button>
    </nav>

    <aside class="detail is-open" id="detail" aria-label="Panneau">
      <div class="detail-bar">
        <h2 id="detail-title">Portes-lès-Valence</h2>
      </div>
      <p class="detail-empty" id="detail-empty" hidden>Chargement des prévisions…</p>
      <div class="detail-body" id="detail-body"></div>
      <p id="soon" hidden>Bientôt disponible</p>
    </aside>

    <footer class="daybar">
      <button type="button" class="day-nav" id="prev-day" aria-label="Jour précédent">‹</button>
      <div class="day-meta">
        <p id="day-label">—</p>
        <p id="maj-label" class="muted"></p>
      </div>
      <button type="button" class="day-nav" id="next-day" aria-label="Jour suivant">›</button>
    </footer>
  </div>
  <div id="chart-lightbox" class="chart-lightbox" hidden>
    <button type="button" class="chart-lightbox-close" aria-label="Fermer">×</button>
    <div class="chart-lightbox-stage" id="chart-lightbox-stage"></div>
  </div>
  <script src="js/session.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/courbes.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/quotidien.js"></script>
</body>
</html>
